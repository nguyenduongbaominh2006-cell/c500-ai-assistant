<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Quản Lý Web - C500</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="h-full bg-slate-950 text-slate-100 p-8 overflow-y-auto">
    <div class="max-w-4xl mx-auto space-y-6">
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-bold text-amber-400">Dashboard Quản Lý Hệ Thống C500</h1>
            <a href="index.html" class="bg-slate-800 px-4 py-2 rounded-xl text-xs">Quay lại khung chat</a>
        </div>
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
            <h3 class="text-sm font-bold text-emerald-400 mb-3">Nhật Ký Vi Phạm An Ninh & Biểu Tình</h3>
            <table class="w-full text-left text-xs text-slate-300">
                <thead class="border-b border-slate-800 text-slate-400">
                    <tr>
                        <th class="py-2">Thời gian</th>
                        <th class="py-2">Tài khoản</th>
                        <th class="py-2">Từ khóa</th>
                        <th class="py-2">Câu hỏi</th>
                    </tr>
                </thead>
                <tbody id="violation-logs"></tbody>
            </table>
        </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script>
        auth.onAuthStateChanged(async user => {
            if(!user || user.email !== "nguyenduongbaominh2006@gmail.com") {
                alert('Truy cập bị từ chối!');
                window.location.href = 'index.html';
                return;
            }
            const snap = await db.collection('violations').orderBy('timestamp', 'desc').get();
            const tbody = document.getElementById('violation-logs');
            snap.forEach(doc => {
                const d = doc.data();
                tbody.innerHTML += `<tr class="border-b border-slate-800/40"><td class="py-2 text-slate-400">${new Date(d.timestamp).toLocaleString()}</td><td class="py-2 text-emerald-300">${d.user}</td><td class="py-2 text-red-400 font-bold">${d.keyword}</td><td class="py-2">${d.query}</td></tr>`;
            });
        });
    </script>
</body>
</html>
