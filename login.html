<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Định Danh - Trợ lý AI C500</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex items-center justify-center p-4">
    <div class="bg-slate-900/90 border border-emerald-500/40 rounded-3xl max-w-md w-full p-8 shadow-2xl relative">
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-emerald-600 via-yellow-500 to-emerald-600"></div>
        
        <!-- Form Đăng Nhập -->
        <div id="login-container">
            <div class="w-16 h-16 bg-emerald-800 rounded-2xl mx-auto flex items-center justify-center text-yellow-400 text-2xl mb-4 border border-yellow-500/40">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 class="text-xl font-bold text-center mb-1 text-white">Đăng Nhập Hệ Thống C500</h1>
            <p class="text-xs text-slate-400 text-center mb-6">Nhập thông tin định danh sĩ quan để tiếp tục.</p>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-emerald-400 mb-1">Gmail</label>
                    <input type="email" id="login-email" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-emerald-400 mb-1">Mật khẩu</label>
                    <input type="password" id="login-password" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wider transition">Đăng Nhập</button>
            </form>
            <div class="text-center mt-4">
                <button onclick="toggleView('register')" class="text-xs text-emerald-400 hover:underline">Chưa có tài khoản? Đăng ký định danh mới</button>
            </div>
        </div>

        <!-- Form Đăng Ký Riêng Biệt -->
        <div id="register-container" class="hidden">
            <h2 class="text-lg font-bold text-center mb-1 text-yellow-400">Đăng Ký Hồ Sơ Sĩ Quan</h2>
            <p class="text-[11px] text-slate-400 text-center mb-4">Điền đầy đủ thông tin định danh sinh viên C500.</p>
            
            <form id="register-form" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-semibold text-emerald-400 mb-1">Họ và tên đầy đủ</label>
                    <input type="text" id="reg-fullname" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-semibold text-emerald-400 mb-1">Lớp học</label>
                        <input type="text" id="reg-class" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-emerald-400 mb-1">Chuyên ngành</label>
                        <input type="text" id="reg-major" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-emerald-400 mb-1">Ngày sinh</label>
                    <input type="text" id="reg-dob" placeholder="DD/MM/YYYY" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-emerald-400 mb-1">Gmail</label>
                    <input type="email" id="reg-email" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-emerald-400 mb-1">Mật khẩu</label>
                    <input type="password" id="reg-password" required minlength="6" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                </div>
                <div class="flex space-x-2 pt-2">
                    <button type="button" onclick="toggleView('login')" class="w-1/3 bg-slate-800 text-slate-300 py-2 rounded-xl text-xs">Quay lại</button>
                    <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-xl text-xs font-bold">Xác Nhận Đăng Ký</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script>
        function toggleView(view) {
            if(view === 'register') {
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('register-container').classList.remove('hidden');
            } else {
                document.getElementById('register-container').classList.add('hidden');
                document.getElementById('login-container').classList.remove('hidden');
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await auth.signInWithEmailAndPassword(document.getElementById('login-email').value, document.getElementById('login-password').value);
                window.location.href = 'setup.html';
            } catch(err) { alert(err.message); }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const cred = await auth.createUserWithEmailAndPassword(document.getElementById('reg-email').value, document.getElementById('reg-password').value);
                await db.collection('users').doc(cred.user.uid).set({
                    fullName: document.getElementById('reg-fullname').value,
                    studentClass: document.getElementById('reg-class').value,
                    major: document.getElementById('reg-major').value,
                    dob: document.getElementById('reg-dob').value,
                    email: document.getElementById('reg-email').value
                });
                alert('Đăng ký thành công!');
                window.location.href = 'setup.html';
            } catch(err) { alert(err.message); }
        });
    </script>
</body>
</html>
