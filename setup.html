
<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#020617">
    <title>Cấu Hình Trợ Lý AI C500</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100%;
            background:
                radial-gradient(
                    ellipse at top,
                    rgba(6, 95, 70, 0.2),
                    transparent 55%
                ),
                #020617;
        }

        .field {
            width: 100%;
            background: #020617;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 11px 13px;
            color: white;
            font-size: 13px;
            outline: none;
        }

        .field:focus {
            border-color: #10b981;
        }

        .field:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>

<body class="min-h-full text-slate-100 flex items-center justify-center p-4">

    <main class="bg-slate-900 border border-emerald-500/40
                 rounded-3xl max-w-md w-full p-7 shadow-2xl">

        <header class="text-center mb-6">
            <p class="text-[10px] uppercase tracking-[.3em]
                      text-emerald-400 font-bold">
                C500 • AI ASSISTANT
            </p>

            <h1 class="text-xl font-extrabold text-yellow-400 mt-2">
                Thiết Lập Trợ Lý AI Cá Nhân
            </h1>

            <p class="text-xs leading-5 text-slate-400 mt-2">
                Tùy chỉnh hồ sơ trợ lý của bạn.
                Không cần nhập API key cá nhân.
            </p>
        </header>

        <section class="rounded-xl border border-emerald-800
                        bg-emerald-950/40 p-3 mb-5">
            <p class="text-xs leading-5 text-emerald-200">
                <strong>AI dùng chung của hệ thống</strong><br>
                Khóa truy cập AI được quản lý ở máy chủ.
                Thành viên sử dụng tài khoản đăng nhập hiện có.
            </p>
        </section>

        <form id="setup-form" class="space-y-4">

            <div class="grid grid-cols-2 gap-3">

                <div>
                    <label for="hair-color"
                           class="block text-xs font-semibold
                                  text-emerald-400 mb-1">
                        Màu tóc
                    </label>

                    <select id="hair-color" class="field">
                        <option value="black">Đen</option>
                        <option value="brown">Nâu</option>
                        <option value="white">Trắng</option>
                    </select>
                </div>

                <div>
                    <label for="uniform-type"
                           class="block text-xs font-semibold
                                  text-emerald-400 mb-1">
                        Sắc phục
                    </label>

                    <select id="uniform-type" class="field">
                        <option value="police">Cảnh sát</option>
                        <option value="security">An ninh</option>
                    </select>
                </div>

            </div>

            <div>
                <label for="ai-nickname"
                       class="block text-xs font-semibold
                              text-emerald-400 mb-1">
                    Biệt danh AI
                </label>

                <input
                    type="text"
                    id="ai-nickname"
                    maxlength="60"
                    placeholder="Ví dụ: Sĩ quan Bôm..."
                    required
                    class="field"
                >
            </div>

            <p id="status"
               class="hidden text-xs leading-5"
               role="status"
               aria-live="polite"></p>

            <button
                type="submit"
                id="submit-btn"
                class="w-full bg-emerald-600 hover:bg-emerald-500
                       disabled:opacity-50 text-white font-bold
                       py-3 rounded-xl text-xs uppercase
                       tracking-wider transition">
                Lưu cấu hình &amp; vào Chat
            </button>

        </form>
    </main>

    <script src="js/firebase-config.js"></script>

    <script>
        "use strict";

        let activeUser = null;

        const form = document.getElementById("setup-form");
        const button = document.getElementById("submit-btn");
        const statusBox = document.getElementById("status");

        function showStatus(message, type = "error") {
            statusBox.textContent = message;
            statusBox.className =
                "text-xs leading-5 " +
                (type === "success"
                    ? "text-emerald-300"
                    : "text-red-300");
        }

        // Chỉ cho phép người đã đăng nhập thiết lập hồ sơ.
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            activeUser = user;

            try {
                const configRef = db
                    .collection("users")
                    .doc(user.uid)
                    .collection("settings")
                    .doc("ai_config");

                const snapshot = await configRef.get();

                if (!snapshot.exists) return;

                const config = snapshot.data() || {};

                if (config.hairColor) {
                    document.getElementById("hair-color").value =
                        config.hairColor;
                }

                if (config.uniformType) {
                    document.getElementById("uniform-type").value =
                        config.uniformType;
                }

                if (config.nickname) {
                    document.getElementById("ai-nickname").value =
                        config.nickname;
                }

            } catch (error) {
                console.error("Không tải được cấu hình:", error);
                showStatus(
                    "Không tải được cấu hình cũ. Bạn vẫn có thể thử lưu lại."
                );
            }
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (!activeUser) {
                showStatus(
                    "Phiên đăng nhập chưa sẵn sàng. Vui lòng tải lại trang."
                );
                return;
            }

            const nickname = document
                .getElementById("ai-nickname")
                .value.trim();

            if (!nickname) {
                showStatus("Vui lòng nhập biệt danh AI.");
                return;
            }

            button.disabled = true;
            button.textContent = "Đang lưu cấu hình...";

            try {
                const configRef = db
                    .collection("users")
                    .doc(activeUser.uid)
                    .collection("settings")
                    .doc("ai_config");

                await configRef.set({
                    hairColor:
                        document.getElementById("hair-color").value,

                    uniformType:
                        document.getElementById("uniform-type").value,

                    nickname: nickname,
                    completed: true,

                    updatedAt:
                        firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                // Không còn lưu hoặc yêu cầu API key cá nhân.
                showStatus(
                    "Lưu thành công. Đang chuyển đến khung chat...",
                    "success"
                );

                window.location.href = "index.html";

            } catch (error) {
                console.error("Lỗi lưu cấu hình:", error);

                showStatus(
                    "Không lưu được cấu hình: " +
                    (error.message || "Lỗi không xác định")
                );

                button.disabled = false;
                button.textContent = "Lưu cấu hình & vào Chat";
            }
        });
    </script>

</body>
</html>
